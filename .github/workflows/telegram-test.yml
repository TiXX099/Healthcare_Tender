name: Telegram Connection Test

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "BOT TOKEN configured: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo YES || echo NO)"
          echo "CHAT ID configured: $([ -n "$TELEGRAM_CHAT_ID" ] && echo YES || echo NO)"

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          print("Chat ID received: YES" if chat_id else "Chat ID received: NO")

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": "🧪 Saudi Healthcare Tender Bot\n\nTelegram test successful ✅",
              },
              timeout=30,
          )

          print("Telegram status:", response.status_code)
          print("Telegram response:", response.text)

          response.raise_for_status()
          PY
